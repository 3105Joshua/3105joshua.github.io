title: Josh's Homepage
description: >
  Hi! My name is Josh Liu, a senior studying Computer Engineering at the University of Michigan.
  This page contains some public projects I've worked on in my time here at UMich.
  <br><br>

  <a href="https://drive.google.com/drive/folders/14PK2rdM6xLyD94Inq9-0XGeh9n1H-Hf7">
    Zelda NES Recreation
  </a>
  <br>
  A recreation of the original NES Legend of Zelda Dungeon 1, developed in Unity for EECS 494. 
  I worked on the movement system and enemy mechanics for the game, including Keese, Stalfos, Goriyas, Wallmasters, Gels, Bladetraps, and Aquamentus!
  I also implemented our custom mirror mechanic, as well as the player's health, damage, and knockback mechanics.
  My partner and I used GitHub for version control.
  <br><br>

  <a href="https://drive.google.com/drive/folders/1a2vewdE7YUBIeNPhrvgMaJI98TvouLcE">
    SplitPoint
  </a>
  <br>
  A 3D physics-based puzzle game developed in Unity. Players control a ball that can split into a small, fast form and a large, heavy form to solve puzzles. The game challenges players to use momentum, manipulate pressure plates, navigate tight spaces, and break through obstacles by strategically splitting and merging.
